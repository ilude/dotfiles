[project]
name = "pi-tool-reduction"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "jsonschema",
    "portalocker",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
exclude-newer = "3 days"
index-strategy = "first-index"
no-sources = true
no-build = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*.md",
    "rules/",
]
