[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-research-prototype"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "httpx",
    "pydantic",
]

[project.scripts]
x-research = "x_research.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "3 days"
index-strategy = "first-index"
no-sources = true
