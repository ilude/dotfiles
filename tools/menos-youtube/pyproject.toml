[project]
name = "menos-youtube"
version = "4.0.0"
description = "Shared YouTube client for menos ingestion and local caching"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api==1.2.4",
    "google-api-python-client>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
fetch-transcript = "fetch_transcript:main"
fetch-metadata = "fetch_metadata:main"
ingest-video = "ingest_video:main"
check-job = "check_job:main"
reprocess = "reprocess:main"
channel-videos = "channel_videos:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
