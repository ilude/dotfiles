[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onclave-youtube"
version = "4.0.0"
description = "Shared YouTube client for Onclave ingestion and local caching"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api==1.2.4",
    "google-api-python-client>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
onclave-youtube = "onclave_youtube:main"
fetch-transcript = "fetch_transcript:main"
fetch-metadata = "fetch_metadata:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
    "api_config",
    "channel_videos",
    "check_job",
    "fetch_metadata",
    "fetch_transcript",
    "find_content",
    "get_content",
    "ingest_video",
    "job_utils",
    "list_videos",
    "onclave_client",
    "onclave_youtube",
    "post_annotation",
    "reprocess",
    "search",
    "signing",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
