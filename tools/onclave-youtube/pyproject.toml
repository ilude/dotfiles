[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onclave-youtube"
version = "4.0.0"
description = "Shared YouTube client for Onclave ingestion and local caching"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api==1.2.4",
    "google-api-python-client>=2.0.0",
]

[project.scripts]
fetch-transcript = "fetch_transcript:main"
fetch-metadata = "fetch_metadata:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
    "fetch_metadata",
    "fetch_transcript",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
