onboarding = false

[keys]
previous_tab = "prefix+comma"
next_tab = "prefix+period"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin pane open --plugin local.pi --entrypoint pi --placement tab --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --cwd \"$HERDR_ACTIVE_PANE_CWD\" --env \"PI_HERDR_PROFILE_DIR=$HOME/.dotfiles/pi/profiles/default\" --focus"
description = "open a new Pi instance"

[ui.sidebar.agents.rows_by_agent]
pi = [
    ["state_icon", "agent", "state_text"],
    ["$model", "$context"],
    ["$subagents", "$tasks"],
    ["workspace", "tab"],
]

[ui]
agent_panel_sort = "spaces"

[update]
channel = "stable"
