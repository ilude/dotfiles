[project]
name = "damage-control-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "tree-sitter>=0.23.0",
    "tree-sitter-bash>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
