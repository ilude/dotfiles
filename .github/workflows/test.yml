name: Shell Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Init submodules
        run: git submodule update --init dotbot

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Install zsh (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          install: zsh

      - name: Export zsh executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zsh = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'usr\bin\zsh.exe'
          "ZSH_EXECUTABLE=$zsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap CI contract
        shell: bash
        run: scripts/ci-bootstrap base

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck zsh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck

      - name: Verify zsh dependency
        shell: bash
        run: '"${ZSH_EXECUTABLE:-zsh}" --version'

      - name: Run checks (Linux/macOS)
        if: runner.os != 'Windows'
        run: make check-ci

      - name: Run portable tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: uv run pytest test/ claude/hooks/*/tests/ -m "not zsh" -v --tb=short

      - name: Run zsh runtime contracts
        shell: bash
        run: uv run pytest test/ -m zsh -v --tb=short

  pi-default:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOME: ${{ runner.temp }}/pi-ci-home
      USERPROFILE: ${{ runner.temp }}/pi-ci-home
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25.9.0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.23.0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - name: Install Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force
      - name: Run Windows installer maintenance tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          Invoke-Pester test/install-maintenance.tests.ps1 -EnableExit
      - name: Install current Pi runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          export PNPM_HOME="$HOME/pnpm"
          if command -v cygpath >/dev/null 2>&1; then
            export PNPM_HOME=$(cygpath -m "$PNPM_HOME")
          fi
          export npm_config_global_dir="$PNPM_HOME/global"
          mkdir -p "$PNPM_HOME"
          pnpm_bin="$PNPM_HOME"
          if command -v cygpath >/dev/null 2>&1; then
            pnpm_bin=$(cygpath -u "$PNPM_HOME")
          fi
          export PATH="$pnpm_bin:$PATH"
          printf '%s\n' "PNPM_HOME=$PNPM_HOME" "npm_config_global_dir=$npm_config_global_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$PNPM_HOME" >> "$GITHUB_PATH"
          pi_version=latest
          if resolved_pi_version=$(uv run python scripts/get_latest_agent_version.py pi); then
            pi_version="$resolved_pi_version"
          else
            echo "Warning: could not resolve the latest Pi GitHub release; using the npm latest tag"
          fi
          pnpm --config.minimumReleaseAge=720 add -g --allow-build=koffi --allow-build=protobufjs "@earendil-works/pi-coding-agent@$pi_version"
          command -v pi
          pi --version
      - name: Install default Pi profile (includes offline smoke)
        shell: bash
        run: bash scripts/pi-default-setup
      - name: Verify default profile and setup regressions
        shell: bash
        run: |
          pnpm --dir pi/profiles/default run typecheck
          pnpm --dir pi/profiles/default test
          uv run pytest test/test_pi_profile_setup.py test/test_pi_default_link.py test/test_pi_setup_smoke.py test/test_install_unattended.py
